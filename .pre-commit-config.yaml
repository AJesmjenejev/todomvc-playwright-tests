# Keep the revs equal to the versions in requirements.txt.
# Settings come from pyproject.toml (ruff, mypy).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-ast
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [pytest==9.2.0, playwright==1.64.1, allure-pytest==2.16.2]
  - repo: local
    hooks:
      - id: aaa-structure
        name: AAA structure (# Given / # When / # Then)
        entry: python tools/aaa_structure_linter.py
        language: python # pre-commit's own environment: no dependence on the `python` found on PATH
        pass_filenames: false
