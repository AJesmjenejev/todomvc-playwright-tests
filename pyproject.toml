[tool.pytest.ini_options]
testpaths = ["test_e2e"]
required_plugins = ["pytest-playwright", "allure-pytest"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--output=test-results",
    "--alluredir=allure-results",
    "--clean-alluredir",
    "--allure-no-capture",  # Allure shows steps, screenshot and trace; the full log is in logs/tests.log
]
base_url = "https://demo.playwright.dev/todomvc/"  # keep the trailing slash
filterwarnings = [
    # Raised by pytest-playwright's own base_url fixture under pytest 9, not by our code.
    "ignore:Session-scoped fixtures defined as instance methods are deprecated:DeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-5s %(message)s"
log_cli_date_format = "%H:%M:%S"
log_file = "logs/tests.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s %(levelname)-5s %(message)s"
log_file_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["allure-results", "test-results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # flake8 (pycodestyle + pyflakes) and isort

[tool.mypy]
python_version = "3.12"
strict = true
# allure has no type hints
untyped_calls_exclude = ["allure", "allure_commons"]
disallow_untyped_decorators = false
exclude = ['(^|/)\.venv/', '(^|/)allure-results/', '(^|/)test-results/']

# Only for the packages that have no type hints. Any other missing import is still an error.
[[tool.mypy.overrides]]
module = ["allure.*", "allure_commons.*"]
ignore_missing_imports = true
