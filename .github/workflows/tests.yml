name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # never cancel a run on main: its report may be published

env:
  PYTHON_VERSION: "3.12"
  PYTHON_LATEST: "3.14"
  NODE_VERSION: "24"
  ALLURE_VERSION: "3.22.1" # keep equal to the version in docs/reports-and-logs.md

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - run: ruff check lib test_e2e proofs tools conftest.py
      - run: ruff format --check lib test_e2e proofs tools conftest.py
      - run: python -m mypy lib test_e2e proofs tools conftest.py
      - run: python tools/aaa_structure_linter.py

  # No "needs: quality" on purpose: lint and tests run in parallel, so one run shows both kinds of problems.
  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # run every browser, even if one fails
      matrix:
        # workers = pytest-xdist workers (the runner has 4 CPUs). Measured per browser: more workers helped
        # Firefox little and made WebKit slower.
        include:
          - { browser: chromium, workers: 4 }
          - { browser: firefox, workers: 2 }
          - { browser: webkit, workers: 0 } # 0 = no xdist: WebKit timed out on check() with 4 or 6 workers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m pytest --browser ${{ matrix.browser }} -n ${{ matrix.workers }}
      - name: Keep Allure results for the report job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7
      - name: Keep screenshots and traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # The newest Python, in one browser only: it shows whether "3.12 or newer" in the README is still true.
  python-latest:
    name: E2E tests (chromium, Python latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_LATEST }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest --browser chromium -n 4
      - name: Keep screenshots and traces of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-python-latest
          path: test-results/
          retention-days: 7

  # The proofs break the app on purpose and expect our checks to fail. If nobody runs them, they can stop working.
  proofs:
    name: Proofs (checks can fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - run: uv pip install --system -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest proofs --browser chromium -n 4
      - name: Keep screenshots and traces of failed proofs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-proofs
          path: test-results/
          retention-days: 7

  report:
    name: Allure report
    needs: e2e
    if: ${{ !cancelled() }} # build the report also when tests fail: that is when it is most useful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # for allurerc.json
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx -y allure@${{ env.ALLURE_VERSION }} generate ./allure-results
      - name: Keep the report as a downloadable file
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/index.html
          retention-days: 30
      - name: Prepare the report for GitHub Pages
        if: ${{ vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report/

  publish:
    name: Publish report to GitHub Pages
    needs: report
    # Opt-in: set Settings -> Pages -> Source "GitHub Actions", then add the repository variable PAGES_ENABLED=true.
    if: ${{ vars.PAGES_ENABLED == 'true' && !cancelled() && needs.report.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
